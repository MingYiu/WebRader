<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Web Radar - Real-time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ========== LEFT PANEL - TEAM INFO ========== */
        .side-panel {
            width: 280px;
            min-width: 280px;
            max-width: 280px;
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.95) 0%, rgba(10, 10, 18, 0.98) 100%);
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2a2a3a;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .side-panel.right {
            border-right: none;
            border-left: 2px solid #2a2a3a;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a3a;
        }

        .team-name {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team-name {
            color: #3b82f6;
        }

        .side-panel.right .team-name {
            color: #ef4444;
        }

        .player-card {
            background: rgba(30, 30, 50, 0.6);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .player-card:hover {
            background: rgba(40, 40, 70, 0.8);
            border-color: #3a3a5a;
        }

        .player-card.dead {
            opacity: 0.55;
            background: rgba(80, 80, 80, 0.3);
            filter: grayscale(0.7);
        }

        .player-card.local {
            background: rgba(0, 255, 136, 0.08);
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            background: #2a2a4a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .player-avatar .avatar-letter {
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .player-avatar.is-bot {
            background: linear-gradient(135deg, #4a3a5a, #2a2a4a);
            color: #c98aff;
        }

        .player-avatar.t-team {
            background: linear-gradient(135deg, #2a4a6a, #1a3a5a);
        }

        .player-avatar.ct-team {
            background: linear-gradient(135deg, #4a2a2a, #3a1a1a);
        }

        .steam-link {
            color: #6699cc;
            text-decoration: none;
            font-size: 10px;
            opacity: 0.7;
        }

        .steam-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-card.dead .player-name {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .dead-marker {
            display: inline-block;
            background: #b91c1c;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 6px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .player-weapon {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        /* ========== CENTER - RADAR & INFO ========== */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a12;
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: linear-gradient(180deg, rgba(20, 20, 30, 0.95) 0%, rgba(10, 10, 15, 0.9) 100%);
            border-bottom: 2px solid #2a2a3a;
        }

        .match-info {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 22px;
            font-weight: bold;
            font-family: 'Consolas', monospace;
            color: #fff;
        }

        .map-name {
            font-size: 16px;
            font-weight: bold;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ========== CONNECTION STATUS ========== */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.disconnected {
            background: #ff4444;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ========== RADAR CONTAINER ========== */
        .radar-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            min-width: 0;
            min-height: 0;
        }

        .radar-wrapper {
            position: relative;
            width: min(100%, 900px);
            height: min(100%, 900px);
            aspect-ratio: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 80px rgba(59, 130, 246, 0.1);
            border: 2px solid #2a2a3a;
            flex-shrink: 0;
        }

        .radar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .radar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .radar-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* ========== PLAYER DOTS ON RADAR ========== */
        .radar-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.05s linear;
            pointer-events: none;
        }

        .radar-dot.ct {
            background: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
        }

        .radar-dot.t {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .radar-dot.local {
            width: 14px;
            height: 14px;
            background: #00ff88;
            box-shadow: 0 0 12px #00ff88;
        }

        .radar-dot.dead {
            opacity: 0.5;
        }

        /* ========== BOTTOM BAR ========== */
        .bottom-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 25px;
            background: rgba(15, 15, 25, 0.95);
            border-top: 1px solid #2a2a3a;
        }

        .mode-indicator {
            font-size: 11px;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .mode-indicator.websocket {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        /* ========== SCROLLBAR ========== */
        .side-panel::-webkit-scrollbar {
            width: 6px;
        }

        .side-panel::-webkit-scrollbar-track {
            background: #1a1a2a;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 3px;
        }

        .side-panel::-webkit-scrollbar-thumb:hover {
            background: #4a4a6a;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1200px) {
            .side-panel {
                width: 240px;
            }
            .radar-wrapper {
                max-width: 700px;
                max-height: 700px;
            }
        }

        @media (max-width: 900px) {
            .side-panel {
                width: 200px;
            }
            .radar-wrapper {
                max-width: 500px;
                max-height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- LEFT PANEL - CT TEAM -->
        <div class="side-panel left">
            <div class="panel-header">
                <span class="team-name">CT</span>
            </div>
            <div id="ctPlayers"></div>
        </div>

        <!-- CENTER PANEL -->
        <div class="center-panel">
            <!-- TOP BAR -->
            <div class="top-bar">
                <div class="match-info">
                    <div class="info-item">
                        <span class="info-label">Map</span>
                        <span class="map-name" id="mapName">DUST 2</span>
                    </div>
                </div>
                <div class="connection-status">
                    <div class="status-dot disconnected" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>

            <!-- RADAR -->
            <div class="radar-container">
                <div class="radar-wrapper">
                    <canvas id="radarCanvas" class="radar-canvas"></canvas>
                    <div class="radar-overlay" id="radarOverlay">
                    </div>
                </div>
            </div>

            <!-- BOTTOM BAR -->
            <div class="bottom-bar">
                <div class="mode-indicator websocket" id="modeIndicator">
                    WebSocket Real-time
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL - T TEAM -->
        <div class="side-panel right">
            <div class="panel-header">
                <span class="team-name">T</span>
            </div>
            <div id="tPlayers"></div>
        </div>
    </div>

    <!-- Load map configs -->
    <script src="map_configs.js"></script>

    <script>
        // ========== CONFIG ==========
        // Support dynamic WS URL:
        //   ?ws=wss://...    → explicit override
        //   ?ngrok=1         → auto-derive wss:// from current host (for ngrok deployments)
        //   ngrok domain     → auto-detect wss:// from current host (ngrok-free.app / ngrok.io)
        //   default          → local dev (ws://127.0.0.1:8765)
        const urlParams = new URLSearchParams(window.location.search);
        let WS_URL;
        if (urlParams.has('ws')) {
            WS_URL = urlParams.get('ws');
        } else if (urlParams.has('ngrok') || /ngrok-free\.app|ngrok\.io/i.test(window.location.hostname)) {
            const host = window.location.hostname;
            const wsPort = urlParams.get('ngrok_port') || (window.location.port ? window.location.port : '443');
            WS_URL = `wss://${host}:${wsPort}`;
        } else {
            WS_URL = 'ws://127.0.0.1:8765';
        }
        const HTTP_URL = '/data';  // Fallback

        // ========== STATE ==========
        let matchData = {
            players: [],
            map_name: 'de_dust2',
            local_team: 0
        };

        let radarConfig = {
            pos_x: -2400,
            pos_y: 3380,
            scale: 4.4,
            rotate: 0,
            width: 1024,
            height: 1024
        };

        let ws = null;
        let wsConnected = false;
        let lastUpdateTime = 0;
        let frameId = null;

        // ========== DOM ELEMENTS ==========
        const elements = {
            radarCanvas: document.getElementById('radarCanvas'),
            radarOverlay: document.getElementById('radarOverlay'),
            ctPlayers: document.getElementById('ctPlayers'),
            tPlayers: document.getElementById('tPlayers'),
            mapName: document.getElementById('mapName'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            modeIndicator: document.getElementById('modeIndicator')
        };

        const ctx = elements.radarCanvas.getContext('2d');
        let mapImage = new Image();

        // ========== WEAPON CODES ==========
        const WEAPON_CODES = {
            'ak47': 'AK', 'm4a1': 'M4', 'm4a1_silencer': 'M4S',
            'awp': 'AWP', 'awp': 'AWP', 'ssg08': 'SSG',
            'deagle': 'DGL', 'revolver': 'REV',
            'knife': 'KN', 'knife_t': 'KN',
            'glock': 'GLK', 'usp_silencer': 'USP',
            'p250': 'P25', 'fiveseven': '57',
            'ump45': 'UMP', 'mp9': 'MP9', 'mp7': 'MP7', 'mac10': 'MAC',
            'galilar': 'GAL', 'famas': 'FAM',
            'sg556': 'SG', 'aug': 'AUG',
            'g3sg1': 'G3', 'scar20': 'SCR',
            'negev': 'NEG', 'm249': 'M24',
            'nova': 'NOV', 'xm1014': 'XM', 'mag7': 'MAG',
            'default': 'WP'
        };

        function getWeaponCode(weapon) {
            if (!weapon) return '---';
            const lower = weapon.toLowerCase();
            for (const [key, code] of Object.entries(WEAPON_CODES)) {
                if (lower.includes(key)) return code;
            }
            // CS2 numeric fallback (m_iItemDefinitionIndex -> "weapon_28")
            // Map common def_index values to short codes
            const numeric = weapon.match(/^weapon_(\d+)$/);
            if (numeric) {
                const defIdx = parseInt(numeric[1]);
                const defMap = {
                    1: 'DZ', 2: 'DZS', 3: 'BR', 4: 'GLK', 7: 'ACP',
                    8: 'BM', 9: 'NOVA', 10: 'XM', 11: 'MAC', 13: 'MAG',
                    14: 'MP9', 16: 'MP7', 17: 'UMP', 19: 'P90', 23: 'MP5',
                    24: 'UMP', 25: 'XM', 26: 'PP', 27: 'MAG', 28: 'NEG',
                    29: 'M249', 30: 'TEC', 32: 'P2000', 33: 'USP', 34: 'P250',
                    36: 'P250', 38: 'SCOUT', 39: 'SSG', 40: 'AWP', 41: 'SG',
                    42: 'AUG', 43: 'M249', 44: 'NEG', 45: 'GAL', 46: 'FAM',
                    47: 'AK', 48: 'M4', 49: 'M4S', 50: 'M249', 51: 'DGL',
                    52: 'DGL', 53: 'REV', 54: 'REV', 55: 'DGL', 56: 'DGL',
                    59: 'KN', 60: 'KN', 61: 'USP', 63: 'CZ', 64: 'CZ',
                    500: 'SH', 503: 'SSG', 505: 'SSG', 506: 'SG', 507: 'GAL',
                    508: 'AK', 509: 'SG', 510: 'AUG', 511: 'AUG', 512: 'AUG',
                    514: 'AWP', 515: 'AWP', 516: 'SCR', 517: 'G3', 518: 'SCR',
                    519: 'G3', 520: 'M249', 521: 'NEG', 522: 'M249', 523: 'NEG',
                    525: 'TEC', 526: 'PP'
                };
                if (defMap[defIdx]) return defMap[defIdx];
                return 'W' + defIdx;
            }
            return 'WP';
        }

        // ========== WEBSOCKET CONNECTION ==========
        function connectWebSocket() {
            console.log('[WS] Attempting to connect →', WS_URL);
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log('[WS] Connected!');
                    wsConnected = true;
                    updateConnectionStatus(true);
                    elements.modeIndicator.textContent = 'WebSocket Real-time';
                    elements.modeIndicator.classList.add('websocket');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleGameData(data);
                    } catch (e) {
                        console.error('[WS] Parse error:', e);
                    }
                };

                ws.onclose = () => {
                    console.log('[WS] Disconnected');
                    wsConnected = false;
                    updateConnectionStatus(false);
                    
                    // Reconnect after 2 seconds
                    setTimeout(connectWebSocket, 2000);
                };

                ws.onerror = (error) => {
                    console.error('[WS] Error:', error);
                    wsConnected = false;
                    updateConnectionStatus(false);
                };

            } catch (e) {
                console.error('[WS] Connection failed:', e);
                setTimeout(connectWebSocket, 3000);
            }
        }

        // ========== FALLBACK: HTTP POLLING ==========
        async function fetchData() {
            try {
                const response = await fetch(HTTP_URL);
                if (response.ok) {
                    const data = await response.json();
                    handleGameData(data);
                    updateConnectionStatus(true);
                }
            } catch (e) {
                console.error('[HTTP] Fetch error:', e);
                updateConnectionStatus(false);
            }
        }

        function startHTTPPolling() {
            console.log('[HTTP] Falling back to polling mode');
            elements.modeIndicator.textContent = 'HTTP Polling';
            elements.modeIndicator.classList.remove('websocket');
            setInterval(fetchData, 100); // 10 FPS fallback
        }

        // ========== DATA HANDLER ==========
        function handleGameData(data) {
            console.log('[Radar] handleGameData called:', JSON.stringify(data).substring(0, 200));
            
            // Update match data
            if (data.players) matchData.players = data.players;
            if (data.map_name) {
                matchData.map_name = data.map_name;
                updateMapDisplay(data.map_name);
                loadMapImage(data.map_name);
            }
            if (data.local_team !== undefined) matchData.local_team = data.local_team;
            if (data.local_player) matchData.local_player = data.local_player;

            // Update UI
            updateUI();
            lastUpdateTime = performance.now();
        }

        // ========== UPDATE UI ==========
        function updateUI() {
            // Player lists (only thing left to update)
            updatePlayerLists();
        }

        function updatePlayerLists() {
            // Deduplicate by entity index (same player arriving via multiple classes)
            const seen = new Set();
            const deduped = [];
            for (const p of matchData.players) {
                const idx = p.index;
                if (idx === undefined || idx === null) {
                    deduped.push(p);
                    continue;
                }
                if (seen.has(idx)) {
                    // Keep the local-flagged one if duplicate exists
                    const prev = deduped.find(x => x.index === idx);
                    if (prev && p.is_local && !prev.is_local) {
                        const i = deduped.indexOf(prev);
                        deduped[i] = p;
                    }
                    continue;
                }
                seen.add(idx);
                deduped.push(p);
            }

            const ctList = [];
            const tList = [];

            deduped.forEach(player => {
                if (player.is_team) {
                    ctList.push(player);
                } else {
                    tList.push(player);
                }
            });

            // Sort: local first, then alive first
            const sortFn = (a, b) => {
                if (a.is_local) return -1;
                if (b.is_local) return 1;
                if (a.is_alive !== b.is_alive) return b.is_alive - a.is_alive;
                return (a.name || '').localeCompare(b.name || '');
            };

            ctList.sort(sortFn);
            tList.sort(sortFn);

            elements.ctPlayers.innerHTML = ctList.map(p => createPlayerCardHTML(p, 'ct')).join('');
            elements.tPlayers.innerHTML = tList.map(p => createPlayerCardHTML(p, 't')).join('');

            // Kick off avatar loading for any new SteamIDs (server fetches via XML)
            refreshAvatars(deduped);
        }

        // ========== AVATAR HELPERS ==========
        // Generate color from string (deterministic hash)
        function stringToColor(str) {
            if (!str) return { bg: '#2a2a4a', fg: '#aaa' };
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return {
                bg: `hsl(${hue}, 45%, 35%)`,
                fg: `hsl(${hue}, 70%, 80%)`
            };
        }

        // Get display letters from SteamID (last 2 uppercase chars, or "?" for bots)
        function getAvatarLetters(player) {
            if (player.is_bot) return '🤖';
            const sid = player.steamid || '';
            if (!sid || sid === '0' || sid === 'BOT') return '?';
            // If SteamID64 (17 digits), take last 2 digits; if STEAM_0:X:Y, take from Y
            let numeric = sid;
            const match = sid.match(/^STEAM_[0-9]:([0-9]):([0-9]+)$/);
            if (match) {
                numeric = match[1] + match[2];
            }
            // Take last 2 alphanumeric chars
            const cleaned = numeric.replace(/[^a-zA-Z0-9]/g, '');
            if (cleaned.length === 0) return '?';
            return cleaned.slice(-2).toUpperCase();
        }

        // Convert any SteamID format to SteamID64 (for profile URLs)
        function toSteamID64(sid) {
            if (!sid) return '';
            sid = sid.trim();
            if (/^7656\d{13}$/.test(sid)) return sid;
            const m = sid.match(/^STEAM_[0-9]:([0-9]):([0-9]+)$/);
            if (m) {
                const y = parseInt(m[1]);
                const z = parseInt(m[2]);
                return (BigInt(76561197960265728) + BigInt(z * 2 + y)).toString();
            }
            const u = sid.match(/^\[U:1:(\d+)\]$/);
            if (u) return (BigInt(76561197960265728) + BigInt(u[1])).toString();
            return sid;
        }

        // ========== Avatar loading (no API key required) ==========
        // Server endpoint /avatars fetches real avatar URLs via Steam profile XML scraping.
        const avatarUrlCache = new Map(); // steamid64 -> url string
        let avatarFetchPromise = null;
        let avatarFetchPending = new Set();

        async function fetchAvatarsFromServer(steamids) {
            if (!steamids || steamids.length === 0) return;
            const idsParam = steamids.join(',');
            try {
                const res = await fetch(`/avatars?steamids=${encodeURIComponent(idsParam)}`);
                if (!res.ok) return;
                const data = await res.json();
                let count = 0;
                for (const [sid, info] of Object.entries(data)) {
                    if (info && (info.avatarfull || info.avatarmedium || info.avatar)) {
                        avatarUrlCache.set(sid, info.avatarfull || info.avatarmedium || info.avatar);
                        count++;
                    }
                }
                if (count > 0) console.log(`[Avatar] Loaded ${count} avatars`);
            } catch (e) {
                console.log('[Avatar] Fetch failed:', e.message);
            }
        }

        // Debounced avatar refresh: called each WS update if any steamid is missing/expired
        function refreshAvatars(players) {
            const toFetch = [];
            for (const p of players) {
                if (p.is_bot) continue;
                const sid = p.steamid || '';
                if (!sid || sid === '0' || sid === 'BOT') continue;
                const sid64 = toSteamID64(sid);
                if (!sid64 || !/^7656\d{13}$/.test(sid64)) continue;
                if (!avatarUrlCache.has(sid64)) toFetch.push(sid64);
            }
            if (toFetch.length === 0) return;
            // Deduplicate
            const unique = [...new Set(toFetch)];
            // Throttle: only one fetch in-flight at a time, batch every 1.5s
            if (avatarFetchPromise) return;
            avatarFetchPromise = new Promise((resolve) => {
                setTimeout(async () => {
                    await fetchAvatarsFromServer(unique);
                    avatarFetchPromise = null;
                    resolve();
                }, 1500);
            });
        }

        // Build avatar HTML (letter fallback + optional real img)
        function buildAvatarHTML(player) {
            const isBot = player.is_bot === 1 || !player.steamid || player.steamid === '0';
            const sid = player.steamid || '';
            const letters = getAvatarLetters(player);
            const color = stringToColor(isBot ? 'bot' : sid);
            const teamClass = player.is_team ? 't-team' : 'ct-team';
            const botClass = isBot ? 'is-bot' : '';

            let imgTag = '';
            if (!isBot && sid) {
                const sid64 = toSteamID64(sid);
                const realUrl = avatarUrlCache.get(sid64);
                if (realUrl) {
                    imgTag = `<img src="${realUrl}" crossorigin="anonymous" referrerpolicy="no-referrer" alt="">`;
                }
            }

            const letterSpan = `<span class="avatar-letter">${letters}</span>`;

            return `<div class="player-avatar ${teamClass} ${botClass}" style="background:${isBot ? '' : color.bg};color:${color.fg}" data-sid="${sid}">
                ${imgTag}
                ${letterSpan}
            </div>`;
        }

        // Build Steam profile link
        function buildSteamLinkHTML(player) {
            if (player.is_bot === 1 || !player.steamid || player.steamid === '0') return '';
            const sid64 = toSteamID64(player.steamid);
            return `<a href="https://steamcommunity.com/profiles/${sid64}" target="_blank" class="steam-link" title="Open Steam profile">🔗</a>`;
        }

        function createPlayerCardHTML(player, team) {
            const weapon = getWeaponCode(player.weapon);
            const avatarHTML = buildAvatarHTML(player);
            const steamLinkHTML = buildSteamLinkHTML(player);

            return `
                <div class="player-card ${!player.is_alive ? 'dead' : ''} ${player.is_local ? 'local' : ''}">
                    ${avatarHTML}
                    <div class="player-info">
                        <div class="player-name">${player.name || 'Player'} ${!player.is_alive ? '<span class="dead-marker">💀 DEAD</span>' : ''} ${steamLinkHTML}</div>
                        <div class="player-weapon">${player.weapon || 'Unknown'}</div>
                    </div>
                </div>
            `;
        }

        function updateConnectionStatus(connected) {
            elements.statusDot.classList.toggle('connected', connected);
            elements.statusDot.classList.toggle('disconnected', !connected);
            elements.statusText.textContent = connected ? 'Connected to ' + WS_URL : 'Disconnected';
        }

        // ========== MAP HANDLING ==========
        function getMapId(mapName) {
            if (!mapName) return 'de_dust2';
            // Remove common prefixes/suffixes
            let id = mapName.toLowerCase()
                .replace('maps/', '')
                .replace('.vpk', '')
                .replace('workshop/', '');
            // Handle workshop maps
            if (id.match(/^\d+$/)) return 'de_dust2'; // Workshop ID fallback
            return id;
        }

        function getMapConfig(mapId) {
            return MAPS[mapId] || null;
        }

        function updateMapDisplay(mapName) {
            if (!mapName) return;
            const displayName = mapName
                .replace('maps/', '')
                .replace('.vpk', '')
                .replace(/_/g, ' ')
                .toUpperCase();
            elements.mapName.textContent = displayName;
        }

        function loadMapImage(mapName) {
            const mapId = getMapId(mapName);
            const config = getMapConfig(mapId);
            console.log('[Radar] loadMapImage:', { mapName, mapId, config });

            if (config) {
                radarConfig = {
                    pos_x: config.pos_x,
                    pos_y: config.pos_y,
                    scale: config.scale,
                    rotate: config.rotate || 0,
                    width: config.width,
                    height: config.height
                };

                mapImage.onload = () => {
                    console.log('[Radar] Map image loaded successfully');
                    resizeCanvas();
                };
                mapImage.onerror = () => {
                    console.error('[Radar] Map image FAILED to load:', 'image/' + config.file);
                };
                mapImage.src = 'image/' + config.file;
            } else {
                console.warn('[Radar] No config found for mapId:', mapId);
            }
        }

        // ========== CANVAS & RADAR ==========
        function resizeCanvas() {
            const wrapper = elements.radarCanvas.parentElement;
            const size = Math.min(wrapper.clientWidth, wrapper.clientHeight);
            
            elements.radarCanvas.width = size;
            elements.radarCanvas.height = size;
            
            // Note: render loop continues via requestAnimationFrame, no need to restart
        }

        function gameToCanvas(gameX, gameY) {
            let rawX, rawY;

            // Handle rotation for maps like de_nuke, de_vertigo
            if (radarConfig.rotate === 1) {
                // Rotate 90 degrees clockwise: swap X/Y and adjust signs
                rawX = (gameY - radarConfig.pos_y) / radarConfig.scale;
                rawY = (radarConfig.pos_x - gameX) / radarConfig.scale;
            } else {
                rawX = (gameX - radarConfig.pos_x) / radarConfig.scale;
                rawY = (radarConfig.pos_y - gameY) / radarConfig.scale;
            }

            // Scale to actual canvas size
            const scaleX = elements.radarCanvas.width / radarConfig.width;
            const scaleY = elements.radarCanvas.height / radarConfig.height;

            return {
                x: rawX * scaleX,
                y: rawY * scaleY
            };
        }

        function render() {
            const canvas = elements.radarCanvas;
            const ctx = canvas.getContext('2d');
            
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw map image if loaded
            if (mapImage.complete && mapImage.naturalWidth > 0) {
                ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);
            } else {
                // Draw placeholder
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '12px monospace';
                ctx.fillText('Map: ' + (getMapConfig(getMapId()).name || 'Loading...'), 10, 20);
            }

            // Draw grid
            drawGrid(ctx, canvas);

            // Draw players
            drawPlayers(ctx, canvas);

            // Continue loop
            frameId = requestAnimationFrame(render);
        }

        function drawGrid(ctx, canvas) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;

            // Grid lines
            const gridSize = canvas.width / 4;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(gridSize * i, 0);
                ctx.lineTo(gridSize * i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, gridSize * i);
                ctx.lineTo(canvas.width, gridSize * i);
                ctx.stroke();
            }

            // Center crosshair
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function drawPlayers(ctx, canvas) {
            const seen = new Set();
            matchData.players.forEach(player => {
                if (player.index !== undefined && player.index !== null) {
                    if (seen.has(player.index)) return;
                    seen.add(player.index);
                }
                if (!player.x || !player.y) return;

                // Hide dead players from the map view (lists still show them)
                if (player.is_alive === 0) return;

                const pos = gameToCanvas(player.x, player.y);

                // Check bounds
                if (pos.x < 0 || pos.x > canvas.width || pos.y < 0 || pos.y > canvas.height) {
                    return;
                }

                // Determine color
                let color, glowColor, radius;
                if (player.is_local) {
                    color = '#00ff88';
                    glowColor = 'rgba(0, 255, 136, 0.5)';
                    radius = 7;
                } else if (player.is_team) {
                    color = '#3b82f6';
                    glowColor = 'rgba(59, 130, 246, 0.5)';
                    radius = 6;
                } else {
                    color = '#ef4444';
                    glowColor = 'rgba(239, 68, 68, 0.5)';
                    radius = 6;
                }

                // Glow
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 4, 0, Math.PI * 2);
                ctx.fillStyle = glowColor;
                ctx.fill();

                // Dot
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = player.is_alive ? color : 'rgba(100, 100, 100, 0.3)';
                ctx.fill();

                // Name label above player
                const name = player.name || 'Unknown';
                ctx.font = 'bold 10px "Segoe UI", Arial, sans-serif';
                const textWidth = ctx.measureText(name).width;
                const labelX = pos.x - textWidth / 2;
                const labelY = pos.y - radius - 6;

                // Background pill
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(labelX - 4, labelY - 11, textWidth + 8, 13);

                // Text
                ctx.fillStyle = player.is_local ? '#00ff88' : (player.is_team ? '#93c5fd' : '#fca5a5');
                ctx.fillText(name, labelX, labelY);
            });
        }

        // ========== INIT ==========
        function init() {
            // Set initial map
            loadMapImage(matchData.map_name);

            // Start WebSocket connection
            connectWebSocket();
            
            // Start render loop
            render();

            // Set up resize handler (this will call resizeCanvas -> render)
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Fallback: if no WS connection in 3 seconds, use HTTP polling
            setTimeout(() => {
                if (!wsConnected) {
                    startHTTPPolling();
                }
            }, 3000);
        }

        // Start
        init();
    </script>
</body>
